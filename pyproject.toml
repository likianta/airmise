[project]
name = "airmise"
version = "3.0.0b4"
description = "The native experience of calling remote functions, like local ones."
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.13.3",
    "argsense>=1.2.0a2",
    "lk-logger>=6.0.8a1",
    "lk-utils>=3.6.0b3",
]

[dependency-groups]
dev = [
    "ipython>=9.13.0; python_version >= '3.12'",
    # "streamlit>=1.57.0; python_version >= '3.12'",
    # "streamlit-canary>=0.3.0a15; python_version >= '3.12'",
]

[project.urls]
homepage = "https://github.com/likianta/airmise"

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
force-single-line = true
no-sections = true

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.setuptools]
packages = ["airmise"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2191/"
explicit = true

[tool.uv.sources]
argsense = { index = "likianta" }
lk-logger = { index = "likianta" }
lk-utils = { index = "likianta" }
streamlit-canary = { index = "likianta" }
